name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux-x64
            bin_dir: build
            config_args: ""
            build_args: ""
            ctest_args: ""
          - os: windows-latest
            platform: Windows-x64
            bin_dir: build/Release
            config_args: "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            build_args: "--config Release"
            ctest_args: "-C Release"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Boost (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev

      - name: Install Boost (Windows)
        if: runner.os == 'Windows'
        run: "& \"$env:VCPKG_INSTALLATION_ROOT\\vcpkg.exe\" install boost-system boost-thread boost-serialization boost-filesystem boost-program-options --triplet x64-windows"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build ${{ matrix.config_args }}

      - name: Build
        run: cmake --build build --parallel ${{ matrix.build_args }}

      - name: Test
        run: ctest --test-dir build --output-on-failure ${{ matrix.ctest_args }}

      - name: Package
        run: python scripts/package_release.py --build-dir ${{ matrix.bin_dir }} --platform ${{ matrix.platform }} --version 1.0 --output-dir dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: VinaMetal-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
