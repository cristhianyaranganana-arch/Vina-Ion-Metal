name: build

# Vina-Ion-Metal (audit #14 + workflow fix): the VinaMetal 1.0.0 workflow had a
# corrupted trigger (`branches: ain]`) that silently disabled CI on push/PR.
# Triggers are now valid, the build remains Linux x86-64 with static Boost, and
# the byte-identical regression test downloads the official AutoDock Vina 1.2.7
# reference binary (audit #13).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="1.0.0"
          fi
          echo "VINA_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Install Boost
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBoost_USE_STATIC_LIBS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Download reference AutoDock Vina 1.2.7 (regression test)
        run: |
          mkdir -p reference
          curl -fL -o reference/vina_1.2.7 \
            https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.7/vina_1.2.7_linux_x86_64
          chmod +x reference/vina_1.2.7
          ./reference/vina_1.2.7 --version

      - name: Test
        env:
          VINA_REFERENCE_BIN: ${{ github.workspace }}/reference/vina_1.2.7
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: python scripts/package_release.py --build-dir build --platform Linux-x64 --version ${{ env.VINA_VERSION }} --output-dir dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: Vina-Ion-Metal-Linux-x64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
